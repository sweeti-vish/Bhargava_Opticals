{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Bhargava Opticians</title>
<link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body>
<main class="page">
  <a href="{% url 'home' %}">Back to home</a>
  <h1 class="page-title">Log in</h1>
  <form method="post" class="rev-form" style="margin-top:20px">
    {% csrf_token %}
    <p class="muted">Username is your 10-digit mobile number.</p>
    {{ form.as_p }}
    <button class="btn primary" type="submit">Log in</button>
    <p class="muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
  </form>
</main>
</body>
</html>
